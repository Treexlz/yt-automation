name: Docker image

# Builds the image, checks that it can render, then publishes it to
# ghcr.io/<owner>/yt-automation so a NAS can just pull it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: yt-automation:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (script check, web server, scene render)
        run: |
          docker run --rm yt-automation:test python3 pipeline/make_video.py rome-never-fell --check
          docker run -d --name app --shm-size=1g -p 8080:8080 yt-automation:test
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 2; done
          curl -sf localhost:8080/api/status
          python3 - <<'EOF'
          import json, urllib.request
          ep = json.load(open("episodes/rome-never-fell.json"))
          req = urllib.request.Request(
              "http://localhost:8080/api/preview",
              data=json.dumps({"episode": ep, "sceneId": "one-empire"}).encode(),
              headers={"Content-Type": "application/json"},
          )
          url = json.load(urllib.request.urlopen(req, timeout=600))["url"]
          img = urllib.request.urlopen("http://localhost:8080" + url).read()
          assert len(img) > 10_000, "preview image too small"
          print("Rendered preview:", url, len(img), "bytes")
          EOF
          docker logs app | tail -20
          docker rm -f app

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
