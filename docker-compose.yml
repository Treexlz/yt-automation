# Run on your NAS or PC:
#   docker compose up -d
# then open http://<machine-ip>:8080
#
# Uses the image GitHub builds from this repo. To build it locally
# instead, run: docker compose up -d --build

services:
  yt-automation:
    image: ghcr.io/treexlz/yt-automation:latest
    build: .
    container_name: yt-automation
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Episodes, voiceovers, videos, music and the voice model all live here.
      - ./data:/data
    # Chrome needs more shared memory than Docker's 64 MB default.
    shm_size: "1gb"
    # Values come from a .env file next to this one (see .env.example).
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Lower this if the machine struggles while rendering, raise it on a fast PC.
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-2}
